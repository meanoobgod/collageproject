[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vercel-flask-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "flask>=3.1",
  "flask-sqlalchemy>=3.1",
  "sqlalchemy>=2.0",
  "numpy>=2.5.3",
  "onnxruntime>=1.22",
  "tokenizers>=0.21",
  "psycopg2-binary>=2.9.0",
  "nltk>=3.10.3",
  "rake-nltk>=1.0.6"
]

[tool.setuptools.packages.find]
include = ["app*"]
