<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
    {% if test_id %}
        <title>Result {{ test_id}}</title>
    {% else %}
        <title>Results</title>
    {% endif %}
</head>
<body>
    <img id="background" src="{{ url_for('static', filename='photos/horizontal-background-2.jpg') }}">
    <nav>
        <a href="/">Home</a>
    </nav>
    <main>
        <div class="card">
            <h2>Get Result</h2>
            <form>
                <label>Test ID</label>
                <input type="text" id="Test Id" name="test_id" placeholder="eg. ABCDEF">
                <label>Password</label>
                <input type="password", id="password" name="password" placeholder="Password">
                <input type="submit" value="Submit">
            </form>

            {% if student_results %}
                <ul class="result-list">
                {% for i in student_results %}
                    <li><span>{{ i["rollno"] }}</span><span>{{ i["score"] }}</span></li>
                {% endfor %}
                </ul>
            {% endif%}
        </div>
    </main>
</body>
<script>
    const testbox = document.getElementById("Test Id");
    const pram = new URLSearchParams(window.location.search);
    const test_id = pram.get("test_id");
    if (test_id != null){
        testbox.value = test_id;
    }
</script>
</html>
